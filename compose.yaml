services:

  ros2: 
    build:
      context: .
      dockerfile: Dockerfile
      args:
          UID: ${UID:-1000}
          GID: ${GID:-1000}

    container_name: ros2_humble_dev

    stdin_open: true
    tty: true

    # ROS 2 DDS + robot communication
    network_mode: host

    # NVIDIA GPU
    gpus: all

    # USB / RealSense
    privileged: true      

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all

      ROS_DOMAIN_ID: 0

      # RViz / GUI
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

    volumes:
      # Your ROS 2 workspace
      - ./ros2_ws:/ros2_ws

      # X11 socket for RViz
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # Persist bash history
      - ./bash_history:/root/.bash_history
      
      # USB access
      - /dev:/dev

    command: bash
    

    
